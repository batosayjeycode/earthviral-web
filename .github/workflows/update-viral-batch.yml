# EarthViral 3-hour AI batch (plan §7.1 / Phase 3).
#
# Runs the batch generator, verifies the site still builds with the new data, then
# commits src/data/generated + public/data. When this workflow succeeds, CI (ci.yml) runs
# on the new commit via `workflow_run` and deploys it — pushes made with GITHUB_TOKEN do
# not trigger `push` workflows. Trigger manually from Actions → "Update viral batch".
#
# Repository settings needed:
#   secrets: GEMINI_API_KEY and/or OPENAI_API_KEY (without either, summaries are non-AI)
#   vars (optional): GEMINI_MODEL, OPENAI_MODEL, MAX_STORIES_PER_COUNTRY (default 10),
#                    AI_CONCURRENCY (default 2)
name: Update viral batch

on:
  schedule:
    # Every 3 hours on the WIB clock (UTC+7), 17 minutes past: 00:17, 03:17, … WIB
    # = 17:17, 20:17, … UTC. Kept off :00, where GitHub most often delays or drops scheduled
    # runs. The minute must match VAS.batchCronMinute (src/lib/scoring.ts), which the site's
    # "Next Update" time uses. (Plan text says `0 */3 * * *`, i.e. 07:00, 10:00 … WIB.)
    - cron: '17 2-23/3 * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: 'Summary provider (auto = Gemini if its key is set, else OpenAI, else none)'
        type: choice
        options: [auto, gemini, openai, none]
        default: auto
      dry_run:
        description: 'Dry run (fetch, cluster and score, but write and commit nothing)'
        type: boolean
        default: false
      resummarize_fallback:
        description: 'Re-summarise stories that still have non-AI text (uses extra AI calls)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: viral-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest main when the job *starts* (a queued run's trigger commit may be stale).
          ref: main

      # Runs are started by the Cloudflare Worker in workers/scheduler (GitHub's own cron
      # never fired here); this schedule is a backup. If both fire, the later one skips.
      - name: Skip a scheduled run if a batch ran in the last 2 hours
        id: guard
        if: github.event_name == 'schedule'
        run: |
          age=$(node -p "Math.floor((Date.now() - Date.parse(require('./src/data/generated/batch-meta.json').generatedAt)) / 60000)")
          echo "Latest batch is ${age} min old."
          if [ "$age" -lt 120 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Skipping."; fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          # Astro 7 needs Node >= 22.23.4
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.skip != 'true'

      - name: Pipeline unit tests
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:unit

      - name: Generate batch
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          # Stories kept per country (default 10; 0 = no cap). Set as a repository variable.
          MAX_STORIES_PER_COUNTRY: ${{ vars.MAX_STORIES_PER_COUNTRY }}
          # Parallel AI calls (default 2). Keep low on free tiers, which rate-limit per minute.
          AI_CONCURRENCY: ${{ vars.AI_CONCURRENCY }}
          PROVIDER: ${{ inputs.provider || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          RESUMMARIZE_FALLBACK: ${{ inputs.resummarize_fallback || false }}
        run: |
          args=(--snapshot batch-snapshot/articles.json)
          if [ "$PROVIDER" != "auto" ]; then args+=(--provider "$PROVIDER"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$RESUMMARIZE_FALLBACK" = "true" ]; then args+=(--resummarize-fallback); fi
          npm run update:viral -- "${args[@]}"

      # Input articles + trend signals, so a batch's clustering can be replayed and tuned
      # later (story files keep only their own sources). Uploaded even if the batch fails.
      - name: Upload batch input snapshot
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: batch-snapshot-${{ github.run_id }}
          path: batch-snapshot/
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify the site builds with the new data
        if: steps.guard.outputs.skip != 'true' && !inputs.dry_run
        run: npm run build

      - name: Commit generated data
        if: steps.guard.outputs.skip != 'true' && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated public/data public/_redirects
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore(data): viral batch $(node -p "require('./src/data/generated/batch-meta.json').batchId")"
          # main may have moved during the run (e.g. a merged PR); data commits rebase cleanly.
          git pull --rebase origin main
          git push origin HEAD:main

      # IndexNow is pinged by ci.yml after the deploy (this run must finish before CI starts).
